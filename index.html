<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternRun — Internships across Europe, in one place</title>
<meta name="description" content="InternRun brings together internship programmes from EU institutions, major employers, and the platforms every student should know about — one searchable list, no signup required.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --burgundy: #7A1F3D;
  --burgundy-dark: #591530;
  --burgundy-light: #A83A5C;
  --gold: #B8863B;
  --bg: #FBF6F2;
  --card-bg: #FFFFFF;
  --ink: #2B1620;
  --ink-soft: #7A6670;
  --border: #EFE1E6;
  --live: #1F7A4D;
  --live-bg: #E8F5EC;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
h1, h2, .wordmark, .pill, .card-title { font-family: 'Space Grotesk', sans-serif; }

/* --- Header --- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(251,246,242,0.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 18px 24px 14px;
}
.topbar-inner { max-width: 1080px; margin: 0 auto; }
.brand-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.wordmark { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
.wordmark span { color: var(--burgundy); }
.tagline { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.search-row { display: flex; gap: 10px; flex-wrap: wrap; }
.search-input {
  flex: 1 1 260px; padding: 11px 16px; border-radius: 12px; border: 1.5px solid var(--border);
  background: #fff; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink);
}
.search-input:focus { outline: none; border-color: var(--burgundy-light); }
.country-select {
  padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border);
  background: #fff; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink); cursor: pointer;
}
.pill-row { display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 2px; -ms-overflow-style: none; scrollbar-width: none; }
.pill-row::-webkit-scrollbar { display: none; }
.filter-group { margin-top: 2px; }
.filter-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--ink-soft); padding: 10px 2px 4px;
}
.pill {
  flex-shrink: 0; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--border);
  background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  transition: all .15s;
}
.pill:hover { border-color: var(--burgundy-light); color: var(--burgundy); }
.pill.active { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }
.pill.active.gold { background: var(--gold); border-color: var(--gold); }

/* --- Main --- */
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
.result-count { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

.card {
  background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--burgundy);
  border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px;
  transition: transform .12s, box-shadow .12s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(122,31,61,0.25); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.chip-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.category-chip {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--burgundy); background: rgba(122,31,61,0.08); padding: 4px 10px; border-radius: 999px;
}
.season-chip {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--gold); background: rgba(184,134,59,0.12); padding: 4px 10px; border-radius: 999px;
}
.paid-chip {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
}
.paid-chip.paid { color: var(--live); background: var(--live-bg); }
.paid-chip.unpaid { color: #8a5a1f; background: #FBEEDD; }
.paid-chip.mixed { color: var(--ink-soft); background: #F1E9EC; }
.live-badge {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--live); background: var(--live-bg); padding: 3px 9px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px;
}
.live-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.card-org { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.card-title { font-size: 16.5px; font-weight: 600; color: var(--ink); line-height: 1.3; margin: 0; }
.card-loc { font-size: 12.5px; color: var(--ink-soft); }
.card-note { font-size: 12.5px; color: var(--burgundy-dark); font-weight: 500; }
.card-link {
  margin-top: 6px; align-self: flex-start; text-decoration: none; font-size: 13px; font-weight: 700;
  color: var(--burgundy); border: 1.5px solid var(--burgundy); padding: 7px 14px; border-radius: 10px;
  transition: background .12s, color .12s;
}
.card-link:hover { background: var(--burgundy); color: #fff; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
.empty-state .big { font-size: 34px; margin-bottom: 8px; }

.footer {
  max-width: 1080px; margin: 20px auto 40px; padding: 20px 24px 0; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--ink-soft); text-align: center;
}

@media (max-width: 640px) {
  .topbar { padding: 14px 16px 10px; }
  .wrap { padding: 16px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <div>
        <div class="wordmark">Intern<span>Run</span></div>
        <div class="tagline">Internships across Europe — EU institutions, employers, and platforms, in one place.</div>
      </div>
    </div>
    <div class="search-row">
      <input class="search-input" id="searchInput" placeholder="Search by role, organisation, or country…">
      <select class="country-select" id="countrySelect"><option value="">All locations</option></select>
    </div>
    <div class="filter-label">Category</div>
    <div class="pill-row" id="pillRow"></div>
    <div class="filter-label">When</div>
    <div class="pill-row" id="seasonRow"></div>
    <div class="filter-label">Pay</div>
    <div class="pill-row" id="paidRow"></div>
  </div>
</div>

<div class="wrap">
  <p class="result-count" id="resultCount"></p>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">No matches</div>
    <div>Try a different category, country, or search term.</div>
  </div>
</div>

<div class="footer">InternRun · a free, no-signup directory of internships across Europe · listings link out to the official source</div>

<script>
const CATEGORY_LABELS = { all: 'All', eu: 'EU Institutions', tech: 'Tech', finance: 'Finance & Consulting', ngo: 'NGOs & Research', platform: 'Platforms & Directories' };
const SEASON_LABELS = { all: 'All', summer: 'Summer internship', spring: 'Spring', other: 'Other' };
const PAID_LABELS = { all: 'All', paid: 'Paid', unpaid: 'Unpaid' };
let ALL_ITEMS = [];
let activeCategory = 'all';
let activeSeason = 'all';
let activePaid = 'all';

function pillRow() {
  const el = document.getElementById('pillRow');
  el.innerHTML = '';
  Object.keys(CATEGORY_LABELS).forEach((key) => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (key === activeCategory ? ' active' : '');
    btn.textContent = CATEGORY_LABELS[key];
    btn.onclick = () => { activeCategory = key; pillRow(); render(); };
    el.appendChild(btn);
  });
}

function seasonRow() {
  const el = document.getElementById('seasonRow');
  el.innerHTML = '';
  Object.keys(SEASON_LABELS).forEach((key) => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (key === activeSeason ? ' active gold' : '');
    btn.textContent = SEASON_LABELS[key];
    btn.onclick = () => { activeSeason = key; seasonRow(); render(); };
    el.appendChild(btn);
  });
}

function paidRow() {
  const el = document.getElementById('paidRow');
  el.innerHTML = '';
  Object.keys(PAID_LABELS).forEach((key) => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (key === activePaid ? ' active' : '');
    btn.textContent = PAID_LABELS[key];
    btn.onclick = () => { activePaid = key; paidRow(); render(); };
    el.appendChild(btn);
  });
}

// Countries come pre-cleaned from the API as it.countries (real European country names, or
// 'Multiple countries' for programmes that span many offices). No more guessing a country out of
// free-text location prose client-side.
function populateCountries() {
  const sel = document.getElementById('countrySelect');
  const countries = new Set();
  ALL_ITEMS.forEach((it) => {
    (it.countries && it.countries.length ? it.countries : ['Multiple countries']).forEach((c) => countries.add(c));
  });
  const sorted = [...countries].filter(Boolean).sort((a, b) => {
    if (a === 'Multiple countries') return 1;
    if (b === 'Multiple countries') return -1;
    return a.localeCompare(b);
  });
  sorted.forEach((c) => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  sel.onchange = render;
}

function matchesFilters(it, q, country) {
  if (activeCategory !== 'all' && it.category !== activeCategory) return false;
  if (country) {
    const countries = it.countries && it.countries.length ? it.countries : ['Multiple countries'];
    if (!countries.includes(country)) return false;
  }
  if (activeSeason !== 'all') {
    const seasons = it.season && it.season.length ? it.season : ['other'];
    if (!seasons.includes(activeSeason)) return false;
  }
  if (activePaid !== 'all') {
    const paid = it.paid;
    if (activePaid === 'paid' && !(paid === true || paid === 'mixed')) return false;
    if (activePaid === 'unpaid' && !(paid === false || paid === 'mixed')) return false;
  }
  if (q) {
    const hay = (it.title + ' ' + it.org + ' ' + it.location + ' ' + (it.note || '')).toLowerCase();
    if (!hay.includes(q.toLowerCase())) return false;
  }
  return true;
}

function paidChip(it) {
  if (it.paid === true) return '<span class="paid-chip paid">Paid</span>';
  if (it.paid === false) return '<span class="paid-chip unpaid">Unpaid</span>';
  return '<span class="paid-chip mixed">Paid &amp; unpaid</span>';
}

function seasonChip(it) {
  const seasons = it.season && it.season.length ? it.season : [];
  if (!seasons.length) return '';
  const label = seasons.includes('summer') ? 'Summer' : (seasons.includes('spring') ? 'Spring round' : 'Other timing');
  return '<span class="season-chip">' + label + '</span>';
}

function render() {
  const q = document.getElementById('searchInput').value.trim();
  const country = document.getElementById('countrySelect').value;
  const items = ALL_ITEMS.filter((it) => matchesFilters(it, q, country));

  document.getElementById('resultCount').textContent = items.length + (items.length === 1 ? ' listing' : ' listings');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';

  if (!items.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  items.forEach((it) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="chip-row">
          <span class="category-chip">${CATEGORY_LABELS[it.category] || it.category}</span>
          ${seasonChip(it)}
          ${paidChip(it)}
        </div>
        ${it.tag === 'live' ? '<span class="live-badge"><span class="dot"></span>Live</span>' : ''}
      </div>
      <div class="card-org">${escapeHtml(it.org)}</div>
      <h3 class="card-title">${escapeHtml(it.title)}</h3>
      <div class="card-loc">${escapeHtml(it.location)}</div>
      ${it.note ? '<div class="card-note">' + escapeHtml(it.note) + '</div>' : ''}
      <a class="card-link" href="${it.url}" target="_blank" rel="noopener">View →</a>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function init() {
  pillRow();
  seasonRow();
  paidRow();
  try {
    const res = await fetch('/api/listings', { cache: 'no-store' });
    const data = await res.json();
    ALL_ITEMS = data.items || [];
  } catch (e) {
    ALL_ITEMS = [];
  }
  populateCountries();
  render();
  document.getElementById('searchInput').addEventListener('input', render);
}
init();
</script>
</body>
</html>
